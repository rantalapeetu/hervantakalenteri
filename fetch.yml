# Tallenna repositoriossa polkuun .github/workflows/fetch.yml
# Lisää repositorion Settings -> Secrets -> Actions: SUPABASE_URL ja SUPABASE_SERVICE_KEY
name: Hae tapahtumat

on:
  schedule:
    - cron: "0 * * * *"   # kerran tunnissa
  workflow_dispatch:       # voi ajaa myös käsin

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests icalendar
      - run: python fetch_events.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
