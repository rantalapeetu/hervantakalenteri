<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hervannan opiskelijakalenteri (prototyyppi)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mute:#5b677a;--line:#d5dbe3;--acc:#0f766e;--warn:#b42318;--ok:#0f766e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#172033;--ink:#e8edf5;--mute:#9aa7bb;--line:#2a3550;--acc:#4fd1c5;--warn:#ff8a7a;--ok:#4fd1c5}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#172033;--ink:#e8edf5;--mute:#9aa7bb;--line:#2a3550;--acc:#4fd1c5;--warn:#ff8a7a;--ok:#4fd1c5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 1.7rem/1.15 "Space Grotesk",system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.demo{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--mute);font-size:.88rem;margin-bottom:16px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--mute);margin-bottom:18px}
.flow b{color:var(--ink);font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.92rem;margin-bottom:18px}
h2{font:700 1rem/1.2 "Space Grotesk",system-ui,sans-serif;margin:22px 0 8px;text-transform:capitalize}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:54px 1fr;gap:12px}
.time{font:700 1.05rem "Space Grotesk",system-ui,sans-serif;padding-top:1px}
.name{font-weight:600}
.meta{color:var(--mute);font-size:.9rem}
.src{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-top:6px;color:var(--mute)}
.src.hand{border-color:var(--acc);color:var(--acc)}
.reg{margin-top:8px;font-size:.9rem;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.reg.urgent{color:var(--warn);font-weight:600}.reg.urgent .dot{background:var(--warn)}
.reg.closed{color:var(--mute)}.reg.closed .dot{background:var(--line)}
.empty{color:var(--mute);padding:24px 0}
details{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
.f{display:grid;gap:10px;margin-top:12px}
.f label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}
.f input,.f select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.f button{font:inherit;font-weight:600;padding:10px;border-radius:8px;border:0;background:var(--acc);color:var(--bg);cursor:pointer}
.ok{color:var(--ok);font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<main>
<h1>Hervannan opiskelijakalenteri</h1>
<p class="sub">Tapahtumat ja ilmoittautumisajat yhdessä paikassa.</p>
<div class="demo">Prototyyppi: kaikki tapahtumat ovat keksittyä esimerkkidataa, eivät oikeita tapahtumia.</div>
<div class="flow" aria-label="Datan kulku"><b>TREY</b><b>Killan sivut</b><b>Lomake</b><span>→ yhteinen muoto →</span><b>Tämä näkymä</b></div>

<div class="chips" id="chips"></div>
<label class="chk"><input type="checkbox" id="onlyReg"> Näytä vain tapahtumat, joihin pitää ilmoittautua</label>
<div id="list"></div>

<details>
<summary>Lisää tapahtuma käsin</summary>
<form class="f" id="form" onsubmit="return false">
<label>Nimi<input id="fn" required></label>
<label>Alkaa<input id="fd" type="datetime-local" required></label>
<label>Järjestäjä<input id="fo" required></label>
<label>Kategoria<select id="fc"></select></label>
<label>Ilmoittautuminen päättyy (valinnainen)<input id="fr" type="datetime-local"></label>
<button type="button" id="add">Lisää tapahtuma</button>
<div class="ok" id="msg" role="status"></div>
</form>
</details>
</main>
<script>
const today=new Date();today.setHours(0,0,0,0);
const at=(n,h)=>{const x=new Date(today);x.setDate(x.getDate()+n);x.setHours(h,0,0,0);return x};
const CATS=["Kaikki","Bileet","Urheilu","Ura","Opinnot"];
let events=[
{n:"Approt (esimerkki)",s:at(3,15),o:"Esimerkkikilta",src:"TREY",c:"Bileet",p:"Keskusta",r:at(1,12)},
{n:"Sitsit (esimerkki)",s:at(2,18),o:"Sähkökilta",src:"Sähkökilta",c:"Bileet",p:"Hervanta",r:at(0,23)},
{n:"Yritysvierailu (esimerkki)",s:at(5,14),o:"Sähkökilta",src:"Sähkökilta",c:"Ura",p:"Kampus",r:at(4,12)},
{n:"Salibandyvuoro (esimerkki)",s:at(1,20),o:"Korkeakoululiikunta",src:"TREY",c:"Urheilu",p:"Liikuntahalli",r:null},
{n:"Rekrytointimessut (esimerkki)",s:at(8,10),o:"Esimerkkiyritys",src:"Lisätty käsin",c:"Ura",p:"Kampus",r:at(6,12)},
{n:"Kurssi-ilmoittautuminen aukeaa (esimerkki)",s:at(0,12),o:"Yliopisto",src:"Sisu",c:"Opinnot",p:"Verkossa",r:null}
];
let cat="Kaikki";
const $=id=>document.getElementById(id);
const fmtDay=d=>d.toLocaleDateString("fi-FI",{weekday:"long",day:"numeric",month:"numeric"});
const fmtT=d=>d.toLocaleTimeString("fi-FI",{hour:"2-digit",minute:"2-digit"});
function reg(e){
 if(!e.r)return"";
 const now=new Date(),ms=e.r-now;
 if(ms<0)return'<div class="reg closed"><span class="dot"></span>Ilmoittautuminen on päättynyt</div>';
 const days=Math.ceil(ms/864e5);
 if(days<=1)return'<div class="reg urgent"><span class="dot"></span>Ilmoittautuminen sulkeutuu '+fmtDay(e.r)+' klo '+fmtT(e.r)+'</div>';
 return'<div class="reg"><span class="dot"></span>Ilmoittautuminen auki, sulkeutuu '+fmtDay(e.r)+' ('+days+' pv)</div>';
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 $("chips").innerHTML=CATS.map(c=>'<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>').join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
 const only=$("onlyReg").checked;
 const list=events.filter(e=>(cat==="Kaikki"||e.c===cat)&&(!only||e.r)).sort((a,b)=>a.s-b.s);
 if(!list.length){$("list").innerHTML='<div class="empty">Ei tapahtumia tällä suodatuksella. Kokeile toista kategoriaa tai lisää tapahtuma alta.</div>';return}
 let out="",last="";
 for(const e of list){
  const k=fmtDay(e.s);
  if(k!==last){out+="<h2>"+k+"</h2>";last=k}
  out+='<div class="ev"><div class="time">'+fmtT(e.s)+'</div><div><div class="name">'+esc(e.n)+'</div><div class="meta">'+esc(e.o)+(e.p?", "+esc(e.p):"")+'</div><span class="src'+(e.src==="Lisätty käsin"?" hand":"")+'">'+esc(e.src)+'</span>'+reg(e)+'</div></div>';
 }
 $("list").innerHTML=out;
}
$("fc").innerHTML=CATS.slice(1).map(c=>"<option>"+c+"</option>").join("");
$("onlyReg").onchange=render;
$("add").onclick=()=>{
 const n=$("fn").value.trim(),d=$("fd").value,o=$("fo").value.trim();
 if(!n||!d||!o){$("msg").textContent="Täytä nimi, alkamisaika ja järjestäjä.";return}
 events.push({n,s:new Date(d),o,src:"Lisätty käsin",c:$("fc").value,p:"",r:$("fr").value?new Date($("fr").value):null});
 $("form").reset();$("msg").textContent="Tapahtuma lisätty.";render();
};
render();
</script>
</body>
</html>
